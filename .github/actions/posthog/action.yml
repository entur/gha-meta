name: PostHog Capture
description: Send a workflow analytics event to PostHog

inputs:
  api_key:
    description: "PostHog project API key"
    required: true
  workflow_inputs:
    description: "Workflow inputs as a JSON string (e.g. toJSON(inputs))"
    required: false
    default: "{}"
  extra_properties:
    description: "Enrich the events with extra custom properties, formatted as json."
    required: false
    default: "{}"

runs:
  using: composite
  steps:
    - name: Resolve calling workflow metadata
      id: calling_workflow_metadata
      env:
        GHA_CALLING_WORKFLOW_REF: ${{ job.workflow_ref }}
        GHA_CALLING_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
      uses: actions/github-script@v9
      with:
        # language=javascript
        script: | 
            const workflowRef = process.env.GHA_CALLING_WORKFLOW_REF;
            const workflowFilepath = process.env.GHA_CALLING_WORKFLOW_FILE_PATH;
            
            const version = workflowRef.split("@")[1]
            
            const nameRegex = /^\.github\/workflows\/([^/]+)\.ya?ml$/;
            const name = workflowFilepath.match(nameRegex)?.[1];
            
            return {
                name: name,
                version: version
            }

    - name: Validate extra properties
      id: validate_extra_properties
      env:
        GHA_EXTRA_PROPERTIES: ${{ inputs.extra_properties }}
      uses: actions/github-script@v9
      with:
        # language=javascript
        script: |
            const properties = JSON.parse(process.env.GHA_EXTRA_PROPERTIES);
            return properties;
    - name: Build properties
      id: build_properties
      shell: bash
      env:
        GHA_CALLING_WORKFLOW_INPUTS:   ${{ inputs.workflow_inputs }}
        GHA_CALLING_WORKFLOW_SHA: ${{ job.workflow_sha }}
        GHA_CALLING_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        GHA_CALLING_WORKFLOW_REF: ${{ job.workflow_ref }}
        GHA_CALLING_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        GHA_CALLING_WORKFLOW_NAME:     ${{ fromJSON(steps.calling_workflow_metadata.outputs.result).name }}
        GHA_CALLING_WORKFLOW_VERSION:  ${{ fromJSON(steps.calling_workflow_metadata.outputs.result).version }}
        GHA_EXTRA_PROPERTIES: ${{ steps.validate_extra_properties.outputs.result }}
      run: |
        set -o pipefail

          # Strip inputs whose key names suggest sensitive content
          GHA_CALLING_WORKFLOW_SAFE_INPUTS=$(echo "$GHA_CALLING_WORKFLOW_INPUTS" | jq -c '
            with_entries(
              select(
                (.key | test("token|secret|key|password|credential|auth"; "i")) | not
              )
            )
          ')

          properties=$(jq -n \
            --arg     calling_workflow_sha        "$GHA_CALLING_WORKFLOW_SHA" \
            --arg     calling_workflow_repository "$GHA_CALLING_WORKFLOW_REPOSITORY" \
            --arg     calling_workflow_ref        "$GHA_CALLING_WORKFLOW_REF" \
            --arg     calling_workflow_file_path  "$GHA_CALLING_WORKFLOW_FILE_PATH" \
            --arg     calling_workflow_name       "$GHA_CALLING_WORKFLOW_NAME" \
            --arg     calling_workflow_version    "$GHA_CALLING_WORKFLOW_VERSION" \
            --argjson calling_workflow_inputs     "$GHA_CALLING_WORKFLOW_SAFE_INPUTS" \
            --argjson extra_properties            "$GHA_EXTRA_PROPERTIES" \
            '{
                calling_workflow_sha:        $calling_workflow_sha,
                calling_workflow_repository: $calling_workflow_repository,
                calling_workflow_ref:        $calling_workflow_ref,
                calling_workflow_file_path:  $calling_workflow_file_path,
                calling_workflow_name:       $calling_workflow_name,
                calling_workflow_version:    $calling_workflow_version
              }
                + ($calling_workflow_inputs | with_entries(.key = ("calling_workflow_input_" + .key)))
                + ($extra_properties | with_entries(.key = ("extra_" + .key)))
            '
          )
          echo "properties=$(echo "$properties" | jq -c .)" >> "$GITHUB_OUTPUT"
    - name: Send event to PostHog
      uses: PostHog/posthog-github-action@58dea254b598fb5d469c0699c98af8288a7f7650  # v1.2.0
      continue-on-error: true
      with:
        event: "gha_workflow_executed"
        posthog-api-host: https://eu.i.posthog.com
        posthog-token: ${{ inputs.api_key }}
        properties: ${{ steps.build_properties.outputs.properties }}
