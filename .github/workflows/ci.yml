name: Entur/Meta/CI

on:
  pull_request:

jobs:
  test-tag-versions-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Extracts the tag-versions step's run block (no duplicated logic) and
      # checks it against a local bare repo: tags land on the release commit
      # even when checkout HEAD differs, and a rejected push moves neither
      # floating tag (atomic).
      - run: |
          set -euo pipefail
          yq -r '.jobs.release-please.steps[] | select(.id == "tag-versions") | .run' .github/workflows/release.yml > /tmp/tag-versions.sh

          d=$(mktemp -d); remote="$d/remote.git"
          git init -q --bare "$remote"
          git init -q "$d/seed"; cd "$d/seed"
          git config user.email t@e.com; git config user.name t
          echo a > f; git add f; git commit -qm first; c1=$(git rev-parse HEAD)
          echo b >> f; git add f; git commit -qm second; c2=$(git rev-parse HEAD)
          git remote add origin "$remote"; git push -q origin HEAD:main
          git tag -a v2 -m x "$c1"; git tag -a v2.1 -m x "$c1"
          git push -q origin refs/tags/v2 refs/tags/v2.1

          git init -q "$d/checkout"; cd "$d/checkout"
          git remote add origin "$remote"
          git fetch -q --depth=1 origin "$c1"; git checkout -q FETCH_HEAD

          RELEASE_MAJOR=2 RELEASE_MINOR=1 RELEASE_SHA="$c2" bash /tmp/tag-versions.sh
          [ "$(git -C "$remote" rev-parse "refs/tags/v2^{commit}")" = "$c2" ] ||
            { echo "v2 did not land on the release commit (not checkout HEAD)"; exit 1; }
          [ "$(git -C "$remote" rev-parse "refs/tags/v2.1^{commit}")" = "$c2" ] ||
            { echo "v2.1 did not land on the release commit (not checkout HEAD)"; exit 1; }

          # Reject only the minor tag; without --atomic, the major tag would move.
          # shellcheck disable=SC2016 # literal hook script, expanded by sh at push time, not here
          printf '#!/bin/sh\n[ "$1" != refs/tags/v2.1 ]\n' > "$remote/hooks/update"
          chmod +x "$remote/hooks/update"
          if RELEASE_MAJOR=2 RELEASE_MINOR=1 RELEASE_SHA="$c1" bash /tmp/tag-versions.sh; then
            echo "expected the remote to reject this push"; exit 1
          fi
          [ "$(git -C "$remote" rev-parse "refs/tags/v2^{commit}")" = "$c2" ] ||
            { echo "v2 moved even though the atomic push was rejected"; exit 1; }
          [ "$(git -C "$remote" rev-parse "refs/tags/v2.1^{commit}")" = "$c2" ] ||
            { echo "v2.1 moved even though the atomic push was rejected"; exit 1; }

          echo "tag-versions checks passed"

  test-local-actions-gcp:
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/cloud-auth
        with:
          environment: dev
          cloud_provider: gcp
          gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT }}
      - uses: ./.github/actions/k8s-auth
        with:
          environment: dev
          cloud_provider: gcp
      - uses: ./.github/actions/docker-auth
        with:
          environment: dev
          cloud_provider: gcp
          gcp_workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

  test-local-actions-azure:
    runs-on: ubuntu-24.04
    environment: az-dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/cloud-auth
        with:
          environment: az-dev
          cloud_provider: az
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/k8s-auth
        with:
          environment: az-dev
          cloud_provider: az
          azure_cluster_resource_group: ${{ vars.AZURE_CLUSTER_RESOURCE_GROUP }}
          azure_cluster_name: ${{ vars.AZURE_CLUSTER_NAME }}
          azure_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/docker-auth
        with:
          environment: az-dev
          cloud_provider: az
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  generate-doc-for-auto-doc:
    needs: [test-local-actions-gcp, test-local-actions-azure]
    uses: ./.github/workflows/auto-doc.yml
    with:
      workflow_file: .github/workflows/auto-doc.yml
      readme_file: README-auto-doc.md
  generate-doc-for-release:
    needs: [test-local-actions-gcp, test-local-actions-azure]
    uses: ./.github/workflows/auto-doc.yml
    with:
      workflow_file: .github/workflows/release.yml
      readme_file: README-release.md
  generate-doc-for-verify-pr:
    needs: [test-local-actions-gcp, test-local-actions-azure]
    uses: ./.github/workflows/auto-doc.yml
    with:
      workflow_file: .github/workflows/verify-pr.yml
      readme_file: README-verify-pr.md
